[project]
name = "license-plate-recognition"
version = "0.1.0"
description = "Vietnamese License Plate Recognition using Classical ML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pillow>=10.2.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "kagglehub>=0.3.0",
    "pywavelets>=1.5.0",
    "umap-learn>=0.5.6",
    "notebook>=7.1.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyterlab>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
