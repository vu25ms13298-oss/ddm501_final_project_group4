groups:
  - name: api_alerts
    rules:
      - alert: APIHighErrorRate
        expr: rate(model_prediction_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High prediction error rate"
          description: "Prediction error rate is {{ $value }} errors/sec over the last 5 minutes."

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(api_request_latency_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (p95 > 5s)"
          description: "95th percentile latency is {{ $value }}s."

      - alert: APIDown
        expr: up{job="lpr-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LPR API is down"
          description: "The LPR API service has been unreachable for more than 1 minute."

  - name: model_alerts
    rules:
      - alert: HighPredictionLatency
        expr: histogram_quantile(0.95, rate(model_prediction_latency_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Model prediction latency is high"
          description: "95th percentile model prediction latency is {{ $value }}s."

      - alert: LowCharacterDetection
        expr: histogram_quantile(0.5, rate(plate_char_count_bucket[10m])) < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low character detection rate"
          description: "Median characters detected per plate is below 5, indicating possible quality issues."

      - alert: LowDetectionConfidence
        expr: histogram_quantile(0.5, rate(detection_confidence_bucket[10m])) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low YOLO detection confidence"
          description: "Median detection confidence is {{ $value }}, below 0.5 threshold."

      - alert: NoPredictions
        expr: rate(model_predictions_total[15m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No predictions in the last 30 minutes"
          description: "The API has not received any prediction requests."

  - name: drift_alerts
    rules:
      # Prediction drift: share of outputs that match a valid plate format.
      - alert: LowRecognitionSuccessRate
        expr: |
          sum(rate(plate_recognition_result_total{result="success"}[30m]))
            / sum(rate(plate_recognition_result_total[30m])) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Recognition success rate below 50%"
          description: "Only {{ $value | humanizePercentage }} of recent predictions produced a valid plate format."

      # Data drift: mean input brightness (1h) deviates >30% from the 7-day baseline.
      - alert: InputBrightnessDrift
        expr: |
          abs(1 - (
            (rate(input_image_brightness_sum[1h]) / rate(input_image_brightness_count[1h]))
            / (rate(input_image_brightness_sum[7d]) / rate(input_image_brightness_count[7d]))
          )) > 0.3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Input image brightness drifted from 7-day baseline"
          description: "Mean brightness differs from the 7-day baseline by {{ $value | humanizePercentage }}."

      # Data drift: mean input width (1h) deviates >50% from the 7-day baseline.
      - alert: InputResolutionDrift
        expr: |
          abs(1 - (
            (rate(input_image_width_pixels_sum[1h]) / rate(input_image_width_pixels_count[1h]))
            / (rate(input_image_width_pixels_sum[7d]) / rate(input_image_width_pixels_count[7d]))
          )) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Input image resolution drifted from 7-day baseline"
          description: "Mean image width differs from the 7-day baseline by {{ $value | humanizePercentage }}."

  # Short-window variants of the drift rules: react within a few minutes so a
  # live simulation (simulations/scenarios.py) can fire them. The 1h-vs-7d
  # rules above remain the production signal.
  - name: drift_alerts_fast
    rules:
      - alert: InputBrightnessDriftFast
        expr: |
          abs(1 - (
            (rate(input_image_brightness_sum[5m]) / rate(input_image_brightness_count[5m]))
            / (rate(input_image_brightness_sum[1h]) / rate(input_image_brightness_count[1h]))
          )) > 0.3
        for: 2m
        labels:
          severity: warning
          window: fast
        annotations:
          summary: "Input brightness (5m) drifted from the 1h baseline"
          description: "Mean brightness differs from the 1h baseline by {{ $value | humanizePercentage }}."

      - alert: InputResolutionDriftFast
        expr: |
          abs(1 - (
            (rate(input_image_width_pixels_sum[5m]) / rate(input_image_width_pixels_count[5m]))
            / (rate(input_image_width_pixels_sum[1h]) / rate(input_image_width_pixels_count[1h]))
          )) > 0.5
        for: 2m
        labels:
          severity: warning
          window: fast
        annotations:
          summary: "Input resolution (5m) drifted from the 1h baseline"
          description: "Mean image width differs from the 1h baseline by {{ $value | humanizePercentage }}."

      - alert: LowRecognitionSuccessRateFast
        expr: |
          (
            sum(rate(plate_recognition_result_total{result="success"}[5m]))
              / sum(rate(plate_recognition_result_total[5m]))
          ) < 0.5
          and sum(rate(plate_recognition_result_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          window: fast
        annotations:
          summary: "Recognition success rate (5m) below 50%"
          description: "Only {{ $value | humanizePercentage }} of predictions in the last 5 minutes produced a valid plate."

      - alert: RateLimitBurst
        expr: sum(increase(model_prediction_errors_total{error_type="rate_limit_exceeded"}[2m])) > 5
        labels:
          severity: warning
          window: fast
        annotations:
          summary: "Clients are being rate limited"
          description: "{{ $value | humanize }} requests were rejected with HTTP 429 in the last 2 minutes."

  - name: system_alerts
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} has been down for more than 2 minutes."
