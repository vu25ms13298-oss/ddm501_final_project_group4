global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: production
    env: lpr-monitoring

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "lpr-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
