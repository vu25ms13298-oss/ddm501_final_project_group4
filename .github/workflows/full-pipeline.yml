name: Full CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.16.9 black==25.9.0
      - run: ruff check src/ api/ scripts/ tests/ responsible_ai/
      - run: black --check src/ api/ scripts/ tests/ responsible_ai/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov=api --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f mlflow/Dockerfile -t lpr-mlflow:test .
      - run: docker build -f api/Dockerfile -t lpr-api:test .

  deploy:
    name: Deploy (Push Docker Images)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          docker build -f api/Dockerfile -t ghcr.io/${{ github.repository }}/lpr-api:latest -t ghcr.io/${{ github.repository }}/lpr-api:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/lpr-api:latest
          docker push ghcr.io/${{ github.repository }}/lpr-api:${{ github.sha }}
      - name: Build and push MLflow image
        run: |
          docker build -f mlflow/Dockerfile -t ghcr.io/${{ github.repository }}/lpr-mlflow:latest -t ghcr.io/${{ github.repository }}/lpr-mlflow:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/lpr-mlflow:latest
          docker push ghcr.io/${{ github.repository }}/lpr-mlflow:${{ github.sha }}
