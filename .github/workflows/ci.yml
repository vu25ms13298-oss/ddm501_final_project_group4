name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: pip install ruff==0.16.9 black==25.9.0

      - name: Run Ruff linter
        run: ruff check src/ api/ scripts/ tests/ responsible_ai/

      - name: Check Black formatting
        run: black --check src/ api/ scripts/ tests/ responsible_ai/
