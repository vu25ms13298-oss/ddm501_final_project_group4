name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff linter
        run: ruff check src/ api/ scripts/ tests/

      - name: Check Black formatting
        run: black --check src/ api/ scripts/ tests/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'api/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run unit tests
        run: pytest tests/test_unit_*.py -v --tb=short

      - name: Run data quality tests
        run: pytest tests/test_data_quality.py -v --tb=short

      - name: Run model validation tests
        run: pytest tests/test_model_validation.py -v --tb=short

      - name: Run integration tests
        run: pytest tests/test_integration_api.py -v --tb=short

      - name: Run all tests with coverage
        run: pytest tests/ --cov=src --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t lpr-api:test .

      - name: Build MLflow image
        run: docker build -f mlflow/Dockerfile -t lpr-mlflow:test .

      - name: Verify docker-compose config
        run: docker compose config --quiet

  deploy:
    name: Deploy (Push Docker Images)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f api/Dockerfile -t ghcr.io/${{ github.repository }}/lpr-api:latest -t ghcr.io/${{ github.repository }}/lpr-api:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/lpr-api:latest
          docker push ghcr.io/${{ github.repository }}/lpr-api:${{ github.sha }}

      - name: Build and push MLflow image
        run: |
          docker build -f mlflow/Dockerfile -t ghcr.io/${{ github.repository }}/lpr-mlflow:latest -t ghcr.io/${{ github.repository }}/lpr-mlflow:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/lpr-mlflow:latest
          docker push ghcr.io/${{ github.repository }}/lpr-mlflow:${{ github.sha }}
