name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: pip install ruff==0.16.9 black==25.9.0

      - name: Run Ruff linter
        run: ruff check src/ api/ scripts/ tests/ responsible_ai/

      - name: Check Black formatting
        run: black --check src/ api/ scripts/ tests/ responsible_ai/

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}

      - name: Install dependencies
        run: |
          # TrueType fonts for the synthetic character/plate generators.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: End-to-end benchmark (synthetic plates, quality gate)
        run: |
          python scripts/generate_synthetic_plates.py --out-dir data/benchmarks/synthetic_plates --n 60
          python scripts/evaluate_lpr_end_to_end.py \
            --manifest data/benchmarks/synthetic_plates/manifest.csv \
            --output results/e2e_synthetic_plates.csv \
            --min-char-accuracy 0.85 --min-exact-accuracy 0.50

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-benchmark
          path: results/e2e_synthetic_plates.csv

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - run: docker compose config --quiet
      - run: docker build -f api/Dockerfile -t lpr-api:test .
      - run: docker build -f docker/mlflow/Dockerfile -t lpr-mlflow:test .
      - run: docker build -f docker/airflow/Dockerfile -t lpr-airflow:test .
      - run: docker build -f trainer/Dockerfile -t lpr-trainer:test .
