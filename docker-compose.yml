services:
  # ---- PostgreSQL (MLflow backend) ----
  postgres:
    image: postgres:13
    container_name: lpr_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lpr_network

  # ---- MLflow tracking server ----
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: lpr_mlflow
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/2.0/mlflow/experiments/search?max_results=1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lpr_network

  # ---- LPR API (FastAPI) ----
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: lpr_api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      # "mlflow": load models:/lpr-ocr-classifier@production, falling back to
      # the baked-in MODELS_DIR when the registry has no production version.
      MODEL_SOURCE: ${MODEL_SOURCE:-mlflow}
      MODEL_URI: ${MODEL_URI:-models:/lpr-ocr-classifier@production}
      MODELS_DIR: /app/models/ocr_hog_svm
      YOLO_MODEL_PATH: /app/models/yolo_runs/license_plate_yolov8_bbox/weights/best.pt
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Required for POST /model/reload (header X-Admin-Token). Empty = disabled.
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:8000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      # YOLO weights are not committed (see README). Drop best.pt here and
      # restart the API to enable YOLO detection without rebuilding the image.
      - ./models/yolo_runs:/app/models/yolo_runs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lpr_network

  # ---- OCR trainer (on demand: docker compose run --rm trainer) ----
  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    container_name: lpr_trainer
    profiles: ["train"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./models:/app/models
      - ./data:/app/data
    networks:
      - lpr_network

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: lpr_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - lpr_network

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: lpr_grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - lpr_network

  # ---- Apache Airflow (ML pipeline orchestration) ----
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: lpr_airflow
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: lpr-airflow-secret-key
      AIRFLOW__WEBSERVER__WORKERS: "2"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LPR_API_URL: http://api:8000
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - airflow_data:/opt/airflow
    ports:
      - "8080:8080"
    # /opt/airflow is a named volume, so a webserver PID file left by a previous
    # container survives restarts and blocks the webserver ("Already running").
    command: bash -c "rm -f /opt/airflow/airflow-webserver*.pid && exec airflow standalone"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - lpr_network

volumes:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  airflow_data:

networks:
  lpr_network:
    driver: bridge
